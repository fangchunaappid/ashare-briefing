name: debug_llm_timing
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 长prompt实测
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cd scripts
          python -c "
          import time, json
          from generate_brief import llm_chat
          fake = {'date': '2026-11-03', '指数行情': 'ok', 'indices': {'上证指数': {'price': 3289.02, 'change_pct': 0.33}, '深证成指': {'price': 11020.5, 'change_pct': 0.51}, '创业板指': {'price': 2315.7, 'change_pct': 0.88}}, '两市成交额_元': 1703436807113, '行业板块领涨': [{'name': '人形机器人', 'change_pct': 3.2}, {'name': '半导体', 'change_pct': 2.1}], '行业板块领跌': [{'name': '白酒', 'change_pct': -1.4}], '概念板块领涨': [{'name': '固态电池', 'change_pct': 4.0}], 'news': ['新闻%d：市场缩量震荡，机器人概念活跃。' % i for i in range(40)]}
          prompt = '请按规则生成简报。原始数据：' + json.dumps(fake, ensure_ascii=False)
          t = time.time()
          out = llm_chat(prompt)
          print('ELAPSED_SEC %.1f' % (time.time() - t))
          print('LEN', len(out))
          print(out[:300])
          "
