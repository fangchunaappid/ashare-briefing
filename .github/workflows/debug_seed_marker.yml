name: debug-seed-marker
on:
  workflow_dispatch: {}
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: 计算北京时间日期
        id: bjdate
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: 写今日标记
        run: mkdir -p output && echo "seed $(date -u +%FT%TZ)" > output/sent_marker
      - uses: actions/cache@v4
        with:
          path: output/sent_marker
          key: briefing-sent-${{ steps.bjdate.outputs.today }}
