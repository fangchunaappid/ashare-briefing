name: A股收盘简报推送

on:
  schedule:
    # 兜底触发：UTC 10:00 = 北京时间 18:00。主触发为外部 cron-job.org（准点）。
    # 若当天已成功推送（Actions Cache 当日标记命中），本运行会自动跳过，避免双重推送。
    - cron: "0 10 * * *"
  workflow_dispatch: {} # 由 cron-job.org 任务 ashare-briefing-18pm 每天 18:00 调用触发；也可在 Actions 页面手动触发

concurrency:
  group: ashare-briefing
  cancel-in-progress: false # 两个触发源撞车时排队串行，先跑的推送，后跑的自动跳过

permissions:
  contents: write # 每日数据归档到 data 分支需要

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 计算北京时间日期
        id: bjdate
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 查今日已推送标记（命中则跳过，防双重推送）
        id: sent
        uses: actions/cache@v4
        with:
          path: output/sent_marker
          key: briefing-sent-${{ steps.bjdate.outputs.today }}

      # ETF 份额快照：跨日恢复最近一次快照，供 fetch_data 计算份额变化（净申购/净赎回）
      - name: 恢复 ETF 份额快照
        if: steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/etf_shares.json
          key: etf-shares-${{ steps.bjdate.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            etf-shares-${{ steps.bjdate.outputs.today }}-
            etf-shares-

      - uses: actions/setup-python@v5
        if: steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        if: steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: 采集数据并生成推送简报
        if: steps.sent.outputs.cache-hit != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/run_all.py

      - name: 保存今日 ETF 份额快照（供次日计算份额变化）
        if: ${{ steps.sent.outputs.cache-hit != 'true' && hashFiles('output/etf_shares.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: output/etf_shares.json
          key: etf-shares-${{ steps.bjdate.outputs.today }}-${{ github.run_id }}

      # 数据沉淀：当日 data.json 归档到 data 分支（文件按日期命名，可回溯趋势）
      - name: 归档当日数据到 data 分支
        if: steps.sent.outputs.cache-hit != 'true'
        env:
          TODAY: ${{ steps.bjdate.outputs.today }}
        run: |
          if [ ! -f data.json ]; then echo "data.json 不存在，跳过归档"; exit 0; fi
          git config user.name "ashare-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin data 2>/dev/null && git checkout -B data origin/data || git checkout --orphan data
          git rm -r --cached . -q 2>/dev/null || true
          mkdir -p data
          cp data.json "data/${TODAY}.json"
          git add data
          git commit -m "data: ${TODAY} 收盘数据归档" 2>/dev/null || echo "无变更"
          git push origin data
